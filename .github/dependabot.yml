# Mises à jour des dépendances, tous les deux mois (le 1er, à 6 h).
# Les alertes de sécurité restent immédiates, indépendamment de ce rythme.
# Les petites mises à jour arrivent en une seule PR ; chaque changement de
# génération (majeure) arrive seul : c'est un signal à étudier, pas à fusionner
# tel quel (Capacitor 9 demande une migration du projet Android).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1 */2 *'
      timezone: Europe/Paris
    groups:
      petites-mises-a-jour:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
